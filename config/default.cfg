benchmark       = C5 : numa-latency   : NUMA local memory latency
benchmark       = C5 : numa-bandwidth : NUMA remote node bandwidth
benchmark       = C5 : numa-false-sharing : False sharing degradation
benchmark       = C5 : numa-migration : NUMA page migration

