#==============================================================================
# ServMark Configuration File
# Format: SPEC CPU 2016 compatible — key = value
# Lines starting with '#' or blank are ignored
# CLI arguments override config file settings
#==============================================================================

#------------------------------------------------------------------------------
# General Settings
#------------------------------------------------------------------------------

# Run mode: peak (locked frequency + cooldown) or sustained (platform-managed)
runmode         = peak

# Parallel instances: 0 = auto-detect online CPUs, N = N instances
threads         = 0

# Copies (per-benchmark)
copies          = 1

# Bind list: physical CPU IDs for per-copy affinity
bind            =

# Output directory for results (provenance.json, results.jsonl, report.html)
output_dir      = .

#------------------------------------------------------------------------------
# Benchmark Selection
#------------------------------------------------------------------------------

# Tier mask: 1=basic, 2=extended, 3=full. Use bitmask: tier=2 means Tier 1 only
tier            = 1

# Category filter: C1..C15 or empty = all categories
category        =

# Reportable only: if 1, skip benchmarks with CV >= 10% (unreliable)
reportable      = 1

#------------------------------------------------------------------------------
# Execution Control
#------------------------------------------------------------------------------

# Minimum iterations per benchmark (overrides default 5)
min_iterations  = 5

# Maximum iterations per benchmark (overrides default 31)
max_iterations  = 31

# Convergence target: SEM/mean ratio (overrides default 0.02)
convergence     = 0.02

# Maximum runtime seconds per benchmark (overrides default 180)
max_runtime     = 180

# Cooldown between categories: seconds (peak mode only)
cooldown_sec    = 30

#------------------------------------------------------------------------------
# Compiler & Optimization
#------------------------------------------------------------------------------

# Use -march=native for peak optimization (non-canonical score)
march_native    = 0

# Architecture ISA baseline override: x86-64-v3, armv8.5-a, rv64gc (empty=auto)
isa_baseline    =

#------------------------------------------------------------------------------
# Mitigation & Safety
#------------------------------------------------------------------------------

# Run mitigations=off reference pass (1 = yes, 0 = official score only)
mitigations_off = 0

# Require pass of pre-flight validation before run (1 = yes, 0 = skip)
require_validate = 1

#------------------------------------------------------------------------------
# Selected Benchmarks
#   Category : Name : Description
#------------------------------------------------------------------------------

# C1 — Integer Compute (Dhrystone 2 equivalences)
benchmark       = C1 : int-hash       : 64-bit integer hash table
benchmark       = C1 : int-sort       : 64-bit integer LSD radix sort
benchmark       = C1 : int-parse      : Integer string parsing
benchmark       = C1 : int-regex      : Naive regex match on log text

# C2 — Float & Vector (Whetstone equivalences)
benchmark       = C2 : fp-gemm        : DGEMM matrix multiply
benchmark       = C2 : fp-fft         : Radix-2 FFT
benchmark       = C2 : fp-conv        : 3x3 convolution
benchmark       = C2 : fp-distance    : Vector dot product + cosine distance
benchmark       = C2 : fp-ray         : Ray-triangle intersection

# C3 — Compression & Crypto (new)
benchmark       = C3 : crypto-zstd    : zstd compress
benchmark       = C3 : crypto-aes     : AES-256-GCM encrypt
benchmark       = C3 : crypto-hash    : SHA-256 hash
benchmark       = C3 : crypto-rsa     : RSA-2048 signature

# C4 — Memory Hierarchy (new)
benchmark       = C4 : mem-latency    : Pointer chase latency
benchmark       = C4 : mem-bandwidth  : Sequential memory read bandwidth
benchmark       = C4 : mem-stream     : STREAM Triad
benchmark       = C4 : mem-random     : Random access latency

